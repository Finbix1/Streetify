<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Streetify - Domaća Muzika</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; flex: 1; height: calc(100vh - 90px); }
        .sidebar {
            width: 240px;
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar h2 { color: #1db954; }
        .main-content {
            flex: 1;
            padding: 30px;
            background: linear-gradient(to bottom, #1e3c72, #121212);
            overflow-y: auto;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .song-card {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: white;
            display: block;
        }
        .song-card:hover { background: #282828; transform: translateY(-4px); }
        .song-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .song-title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
        .song-artist { color: #b3b3b3; font-size: 13px; }

        .player-bar {
            height: 90px;
            background-color: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-top: 1px solid #282828;
        }
        .now-playing { display: flex; align-items: center; gap: 15px; width: 300px; }
        .now-playing img { width: 55px; height: 55px; border-radius: 4px; object-fit: cover; }
        
        audio { width: 350px; height: 40px; outline: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h2>Streetify</h2>
            <p style="color: #b3b3b3; font-size: 13px;">Domaća Muzika</p>
        </div>

        <div class="main-content">
            <h1>Domaće Pesme</h1>
            <p style="color: #b3b3b3; margin-top: 5px;">Klikni na pesmu da je pustiš na YouTube-u ili izaberi radio uživo ispod:</p>

            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="currentThumb" src="https://picsum.photos/200" alt="Cover">
            <div>
                <div class="song-title" id="currentTitle">Uživo Radio Strim</div>
                <div class="song-artist" id="currentArtist">TDI Radio</div>
            </div>
        </div>

        <div>
            <!-- Audio plejer za radijske strimove uživo bez YouTube blokada -->
            <audio id="audioPlayer" controls src="https://streaming.tdiradio.com/tdiradio.mp3"></audio>
        </div>

        <div style="width: 300px;"></div>
    </div>

    <script>
        const resultsGrid = document.getElementById('resultsGrid');

        // Spisak pesama sa direktnim YouTube linkovima i slikama
        const songs = [
            {
                title: "Bella Hadid",
                artist: "Voyage",
                ytUrl: "https://www.youtube.com/watch?v=W3q8Od5qJio",
                cover: "https://img.youtube.com/vi/W3q8Od5qJio/hqdefault.jpg"
            },
            {
                title: "Bebo 3",
                artist: "Nucci",
                ytUrl: "https://www.youtube.com/watch?v=kJQP7kiw5Fk",
                cover: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg"
            },
            {
                title: "Gnezdo Orlovo",
                artist: "Breskvica",
                ytUrl: "https://www.youtube.com/watch?v=3R-c0m4K04E",
                cover: "https://img.youtube.com/vi/3R-c0m4K04E/hqdefault.jpg"
            }
        ];

        songs.forEach(song => {
            const card = document.createElement('a');
            card.classList.add('song-card');
            card.href = song.ytUrl;
            card.target = "_blank"; // Otvara pesmu direktno na YT bez blokade
            card.innerHTML = `
                <img src="${song.cover}" alt="${song.title}">
                <div class="song-title">${song.title}</div>
                <div class="song-artist">${song.artist}</div>
            `;
            resultsGrid.appendChild(card);
        });
    </script>
</body>
</html>
