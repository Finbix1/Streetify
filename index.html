<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Streetify</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; flex: 1; height: calc(100vh - 90px); }
        .sidebar {
            width: 240px;
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar h2 { color: #1db954; margin: 0; }
        .main-content {
            flex: 1;
            padding: 30px;
            background: linear-gradient(to bottom, #1e3c72, #121212);
            overflow-y: auto;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .song-card {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-card:hover { background: #282828; transform: translateY(-4px); }
        .song-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .song-title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
        .song-artist { color: #b3b3b3; font-size: 13px; }

        .player-bar {
            height: 90px;
            background-color: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-top: 1px solid #282828;
        }
        .now-playing { display: flex; align-items: center; gap: 15px; width: 300px; }
        .now-playing img { width: 55px; height: 55px; border-radius: 4px; object-fit: cover; }
        
        audio {
            width: 400px;
            height: 40px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h2>Streetify</h2>
            <p style="color: #b3b3b3; font-size: 13px;">Online Muzički Plejer</p>
        </div>

        <div class="main-content">
            <h1>Izabrane Pesme</h1>
            <p style="color: #b3b3b3;">Klikni na pesmu i pusti muziku odmah:</p>

            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="currentThumb" src="https://picsum.photos/200" alt="Cover">
            <div>
                <div class="song-title" id="currentTitle">Izaberi pesmu</div>
                <div class="song-artist" id="currentArtist">-</div>
            </div>
        </div>

        <div>
            <audio id="audioPlayer" controls></audio>
        </div>

        <div style="width: 300px;"></div>
    </div>

    <script>
        const resultsGrid = document.getElementById('resultsGrid');
        const audioPlayer = document.getElementById('audioPlayer');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentThumb = document.getElementById('currentThumb');

        const songs = [
            {
                title: "Electronic Vibe",
                artist: "Streetify Beats",
                url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3",
                cover: "https://picsum.photos/id/1082/300/300"
            },
            {
                title: "Chillout Wave",
                artist: "Lofi Studio",
                url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3",
                cover: "https://picsum.photos/id/146/300/300"
            },
            {
                title: "Night Drive",
                artist: "Bass Producer",
                url: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3",
                cover: "https://picsum.photos/id/392/300/300"
            }
        ];

        songs.forEach(song => {
            const card = document.createElement('div');
            card.classList.add('song-card');
            card.innerHTML = `
                <img src="${song.cover}" alt="${song.title}">
                <div class="song-title">${song.title}</div>
                <div class="song-artist">${song.artist}</div>
            `;
            
            card.addEventListener('click', () => {
                audioPlayer.src = song.url;
                currentTitle.innerText = song.title;
                currentArtist.innerText = song.artist;
                currentThumb.src = song.cover;
                audioPlayer.play();
            });

            resultsGrid.appendChild(card);
        });
    </script>
</body>
</html>
