<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Streetify</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; flex: 1; height: calc(100vh - 90px); }
        .sidebar {
            width: 240px;
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar h2 { color: #1db954; margin: 0; }
        .main-content {
            flex: 1;
            padding: 30px;
            background: linear-gradient(to bottom, #1e3c72, #121212);
            overflow-y: auto;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .song-card {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-card:hover { background: #282828; transform: translateY(-4px); }
        .song-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .song-title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
        .song-artist { color: #b3b3b3; font-size: 13px; }

        .player-bar {
            height: 90px;
            background-color: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-top: 1px solid #282828;
        }
        .now-playing { display: flex; align-items: center; gap: 15px; width: 300px; }
        .now-playing img { width: 55px; height: 55px; border-radius: 4px; object-fit: cover; }
        
        .sc-player-box {
            width: 320px;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h2>Streetify</h2>
            <p style="color: #b3b3b3; font-size: 13px;">Domaća Muzika Plejer</p>
        </div>

        <div class="main-content">
            <h1>Domaće Pesme</h1>
            <p style="color: #b3b3b3;">Klikni na pesmu i pusti pravi audio:</p>

            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="currentThumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="Cover">
            <div>
                <div class="song-title" id="currentTitle">Izaberi pesmu</div>
                <div class="song-artist" id="currentArtist">-</div>
            </div>
        </div>

        <div class="sc-player-box">
            <iframe id="scPlayer" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1154563810&color=%231db954&auto_play=false&show_comments=false"></iframe>
        </div>
    </div>

    <script>
        const resultsGrid = document.getElementById('resultsGrid');
        const scPlayer = document.getElementById('scPlayer');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentThumb = document.getElementById('currentThumb');

        const songs = [
            {
                title: "Bella Hadid",
                artist: "Voyage",
                trackId: "1154563810",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300"
            },
            {
                title: "Bebo 3",
                artist: "Nucci",
                trackId: "1190234149",
                cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300"
            },
            {
                title: "Gnezdo Orlovo",
                artist: "Breskvica",
                trackId: "1730054799",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300"
            }
        ];

        songs.forEach(song => {
            const card = document.createElement('div');
            card.classList.add('song-card');
            card.innerHTML = `
                <img src="${song.cover}" alt="${song.title}">
                <div class="song-title">${song.title}</div>
                <div class="song-artist">${song.artist}</div>
            `;
            
            card.addEventListener('click', () => {
                scPlayer.src = `https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/${song.trackId}&color=%231db954&auto_play=true&show_comments=false`;
                currentTitle.innerText = song.title;
                currentArtist.innerText = song.artist;
                currentThumb.src = song.cover;
            });

            resultsGrid.appendChild(card);
        });
    </script>
</body>
</html>
